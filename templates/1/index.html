<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Undangan Pernikahan</title>
<style>
:root{--u:#6B4226;--a:#C9A227;--k:#fbf6ea;--t:#3b2a1a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,serif;background:var(--k);color:var(--t);overflow-x:hidden;text-align:center}
body.lock{overflow:hidden;height:100vh}
[hidden]{display:none!important}
h1,h2,h3{font-weight:normal}
.sc{padding:64px 24px;max-width:560px;margin:0 auto}
.sc h2{font-size:26px;color:var(--u);margin-bottom:18px;letter-spacing:1px}
.sc p{line-height:1.8;margin:8px 0}
.ar{font-size:32px;direction:rtl;color:var(--u);margin-bottom:14px}
.btn{display:inline-block;padding:12px 26px;border-radius:30px;background:var(--u);color:#fff;text-decoration:none;border:1px solid var(--a);font:inherit;cursor:pointer;margin:6px}
.btn.alt{background:transparent;color:var(--u)}

/* sampul: dua pintu */
#cover{position:fixed;inset:0;z-index:50;overflow:hidden;background:#2a180c}
.pn{position:absolute;top:0;bottom:0;width:50.5%;background:repeating-linear-gradient(90deg,#5a3720 0 14px,#6B4226 14px 28px);box-shadow:inset 0 0 0 6px var(--a),inset 0 0 40px #0008;transition:transform 1.8s cubic-bezier(.7,0,.2,1)}
.pn img{width:100%;height:100%;object-fit:cover;display:block}
#kiri{left:0}#kanan{right:0}
#cover.open #kiri{transform:translateX(-102%)}
#cover.open #kanan{transform:translateX(102%)}
.cv{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-shadow:0 2px 8px #000a;padding:24px;transition:opacity .7s}
#cover.open .cv{opacity:0;pointer-events:none}
.cv .wy{width:min(46vw,200px);margin-bottom:14px}
.cv h3{font-size:18px;letter-spacing:3px}
.cv h1{font-size:34px;letter-spacing:2px;margin:6px 0}
.cv .to{margin-top:22px;font-size:14px}
.cv .to b{display:block;font-size:20px;margin:4px 0 16px;font-weight:normal}

/* foto pertama */
#hero{position:relative;height:100vh;height:100dvh;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:0 24px 56px;background:linear-gradient(var(--u),#2a180c)}
#hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kb 18s ease-in-out infinite alternate}
#hero::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,#000a)}
#hero .tx{position:relative;z-index:2}
#hero h1{font-size:38px;margin:6px 0}
@keyframes kb{to{transform:scale(1.15)}}

/* animasi scroll */
.rv{opacity:0;transform:translateY(46px);transition:opacity 1s,transform 1s}
.zi{opacity:0;transform:scale(1.3);transition:opacity 1.2s,transform 1.2s}
.zo{opacity:0;transform:scale(.8);transition:opacity 1.2s,transform 1.2s}
.in{opacity:1;transform:none}

/* mempelai */
.ph{width:210px;height:280px;margin:0 auto 14px;border-radius:105px 105px 12px 12px;overflow:hidden;border:3px solid var(--a);background:#e8dcc4}
.ph img{width:100%;height:100%;object-fit:cover}
.amp{font-size:44px;color:var(--a);margin:14px 0}
.nm{font-size:24px;color:var(--u)}

/* acara */
.ev{border:1px solid var(--a);border-radius:14px;padding:22px;margin:14px 0;background:#fff}
.ev h3{font-size:22px;color:var(--u);margin-bottom:6px}
.cd{display:flex;gap:8px;justify-content:center;margin:18px 0}
.cd div{min-width:64px;padding:10px 4px;border-radius:10px;background:var(--u);color:#fff}
.cd b{display:block;font-size:24px;font-weight:normal}
.cd small{font-size:11px}

/* galeri */
.gl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gl div{overflow:hidden;border-radius:10px;background:#e8dcc4}
.gl div.w{grid-column:span 2}
.gl img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.gl .w img{aspect-ratio:4/3}

.ft{padding:26px;background:var(--u);color:#fff;font-size:13px}
#mu{position:fixed;right:14px;bottom:14px;z-index:40;width:44px;height:44px;border-radius:50%;border:1px solid var(--a);background:var(--u);color:#fff;font-size:18px;cursor:pointer;display:none}
</style>
</head>
<body class="lock">

<div id="cover">
  <div class="pn" id="kiri"><img id="ikiri" alt="" hidden></div>
  <div class="pn" id="kanan"><img id="ikanan" alt="" hidden></div>
  <div class="cv">
    <p id="ld">Memuat undangan…</p>
    <div id="cb" hidden>
      <img class="wy" id="iwy" alt="" hidden>
      <h3 data-k="teks sampul"></h3>
      <h1 id="cn"></h1>
      <div class="to"><span data-k="teks untuk tamu"></span><b id="gn"></b></div>
      <button class="btn" id="open" data-k="teks tombol buka"></button>
    </div>
  </div>
</div>

<main id="mn" hidden>
  <section id="hero">
    <img id="ifp" alt="" hidden>
    <div class="tx rv">
      <h3 data-k="teks sampul"></h3>
      <h1 id="hn"></h1>
      <p id="hd"></p>
    </div>
  </section>

  <section class="sc rv">
    <p data-k="salam pembuka"></p>
    <p><i data-k="kutipan"></i></p>
    <p data-k="sumber kutipan"></p>
  </section>

  <section class="sc">
    <p class="ar rv" data-k="basmalah"></p>
    <p class="rv" data-k="teks undangan"></p>
    <div class="zi" style="margin-top:28px">
      <div class="ph"><img id="ipria" alt="" hidden></div>
      <div class="nm" data-k="nama pria"></div>
      <p id="op"></p>
    </div>
    <div class="amp rv">&amp;</div>
    <div class="zi">
      <div class="ph"><img id="iwanita" alt="" hidden></div>
      <div class="nm" data-k="nama wanita"></div>
      <p id="ow"></p>
    </div>
  </section>

  <section class="sc">
    <h2 class="rv">Acara</h2>
    <div id="evs"></div>
    <div class="cd rv" id="cd" hidden>
      <div><b id="c0">0</b><small>Hari</small></div>
      <div><b id="c1">0</b><small>Jam</small></div>
      <div><b id="c2">0</b><small>Menit</small></div>
      <div><b id="c3">0</b><small>Detik</small></div>
    </div>
  </section>

  <section class="sc" id="galeri">
    <h2 class="rv">Galeri</h2>
    <div class="gl" id="gl"></div>
  </section>

  <section class="sc rv" id="rsvp">
    <h2>Konfirmasi Kehadiran</h2>
    <p id="rs"></p>
    <a class="btn" id="wh" target="_blank" rel="noopener"></a>
    <a class="btn alt" id="wt" target="_blank" rel="noopener"></a>
  </section>

  <section class="sc rv">
    <p data-k="teks penutup"></p>
    <p data-k="salam penutup"></p>
    <h2 id="fn" style="margin-top:18px"></h2>
  </section>
  <div class="ft">Undangan digital</div>
</main>

<audio id="au" loop preload="none"></audio>
<button id="mu" aria-label="Musik">♪</button>

<script src="../../core.js"></script>
<script>
const $ = i => document.getElementById(i), U = Undangan;
const DEF = { 'teks sampul': 'Our Wedding', 'teks tombol buka': 'Buka Undangan', 'teks untuk tamu': 'Kepada Yth.' };
const fail = m => { $('ld').textContent = m; };

(async () => {
  const sid = U.q('sheet');
  if (!sid) return fail('Link undangan tidak lengkap.');
  try { render(await U.fetchSheet(sid)); } catch (e) { fail(e.message); }
})();

function render(d) {
  const root = document.documentElement.style;
  if (U.hex(d['warna utama'])) root.setProperty('--u', d['warna utama']);
  if (U.hex(d['warna aksen'])) root.setProperty('--a', d['warna aksen']);

  const names = U.panggilan(d, 'pria') + ' & ' + U.panggilan(d, 'wanita'), tamu = U.guest(d), t = U.waktu(d);
  document.title = 'Undangan Pernikahan ' + names;
  document.querySelectorAll('[data-k]').forEach(e => {
    const v = d[e.dataset.k] || DEF[e.dataset.k];
    if (v) e.textContent = v; else e.hidden = true;
  });
  $('cn').textContent = $('hn').textContent = $('fn').textContent = names;
  $('gn').textContent = tamu;
  $('hd').textContent = [t && U.hari(t), d.tanggal].filter(Boolean).join(', ');

  // gambar
  const pic = (id, k, w) => { const e = $(id); if (!U.setImg(e, d[k], w)) return false; e.hidden = false; return true; };
  pic('ikiri', 'pintu kiri', 900); pic('ikanan', 'pintu kanan', 900); pic('iwy', 'wayang', 600); pic('ifp', 'foto pertama', 1400);
  if (!pic('ipria', 'foto pria', 700)) $('ipria').parentNode.hidden = true;
  if (!pic('iwanita', 'foto wanita', 700)) $('iwanita').parentNode.hidden = true;

  // orang tua
  const ortu = (jk, label) => {
    const ps = [d['bapak ' + jk] && 'Bapak ' + d['bapak ' + jk], d['ibu ' + jk] && 'Ibu ' + d['ibu ' + jk]].filter(Boolean).join(' & ');
    return ps ? `${label}${d['anak ke ' + jk] ? ' ' + d['anak ke ' + jk] : ''} dari ${ps}` : '';
  };
  $('op').textContent = ortu('pria', 'Putra'); $('op').hidden = !$('op').textContent;
  $('ow').textContent = ortu('wanita', 'Putri'); $('ow').hidden = !$('ow').textContent;

  // acara (utama dan opsional kedua)
  ['', ' 2'].forEach(s => {
    if (!d['tanggal' + s]) return;
    const c = document.createElement('div'); c.className = 'ev rv';
    const add = (tag, txt) => { if (!txt) return; const e = document.createElement(tag); e.textContent = txt; c.append(e); };
    add('h3', d['nama acara' + s]);
    add('p', (!s && t ? U.hari(t) + ', ' : '') + d['tanggal' + s]);
    add('p', [d['jam' + s], d['jam selesai' + s]].filter(Boolean).join(' – '));
    add('p', d['nama tempat' + s]); add('p', d['alamat' + s]);
    const m = d['link alamat' + s];
    if (/^https:\/\//.test(m || '')) {
      const a = document.createElement('a');
      a.className = 'btn'; a.href = m; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Lihat Peta';
      c.append(a);
    }
    $('evs').append(c);
  });

  // hitung mundur
  if (t) {
    $('cd').hidden = false;
    const tick = () => {
      let s = Math.max(0, Math.floor((t - Date.now()) / 1000));
      [86400, 3600, 60, 1].forEach((n, i) => { $('c' + i).textContent = Math.floor(s / n); s %= n; });
    };
    tick(); setInterval(tick, 1000);
  }

  // galeri
  for (let i = 1; i <= 12; i++) {
    if (!d['galeri ' + i]) continue;
    const w = document.createElement('div'), im = new Image();
    w.className = i % 2 ? 'zi' : 'zo'; im.alt = ''; im.loading = 'lazy';
    im.onload = () => { if (im.naturalWidth > im.naturalHeight) w.classList.add('w'); };
    U.setImg(im, d['galeri ' + i], 900);
    w.append(im); $('gl').append(w);
  }
  if (!$('gl').children.length) $('galeri').hidden = true;

  // RSVP
  if (d['nomor wa']) {
    $('wh').href = U.waLink(d, true, tamu); $('wh').textContent = d['teks tombol hadir'] || 'Konfirmasi Hadir';
    $('wt').href = U.waLink(d, false, tamu); $('wt').textContent = d['teks tombol tidak hadir'] || 'Tidak Bisa Hadir';
    $('rs').textContent = 'Kepada ' + tamu;
  } else $('rsvp').hidden = true;

  // musik: file mp3 ada di folder musik/ pada repo
  const au = $('au'), mu = $('mu');
  if (d.musik) {
    au.src = '../../musik/' + encodeURIComponent(d.musik);
    mu.style.display = 'block';
    mu.onclick = () => { if (au.paused) { au.play(); mu.textContent = '♪'; } else { au.pause(); mu.textContent = 'II'; } };
  }

  // tampil + buka undangan
  $('ld').hidden = true; $('cb').hidden = false; $('mn').hidden = false;
  $('open').onclick = () => {
    $('cover').classList.add('open');
    document.body.classList.remove('lock');
    scrollTo(0, 0);
    if (d.musik) au.play().catch(() => {});
    setTimeout(() => { $('cover').hidden = true; }, 2000);
    const io = new IntersectionObserver(es => es.forEach(e => e.target.classList.toggle('in', e.isIntersecting)), { threshold: .15 });
    document.querySelectorAll('.rv,.zi,.zo').forEach(e => io.observe(e));
  };
}
</script>
</body>
</html>
